name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build binaries
        run: make build_all

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  release:
    # only runs for tags like v1.2.3
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Create checksums
        working-directory: bin
        run: sha256sum fake-dns_* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
