name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build binaries
        run: make build_all

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  release:
    # only runs for tags like v1.2.3
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # GPG secrets live in the release environment; restrict it to v* tags in the repo settings
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Create checksums
        working-directory: bin
        run: sha256sum fake-dns_* > checksums.txt

      - name: Sign checksums
        working-directory: bin
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --armor --detach-sign \
            --output checksums.txt.asc checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
